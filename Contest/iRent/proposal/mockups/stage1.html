<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
body { background: #000; color: #fff; }
.status { color: #fff; position: absolute; top: 0; left: 0; right: 0; z-index: 5; }
.cam-head { position: absolute; top: 44px; left: 0; right: 0; height: 66px; background: rgba(0,0,0,.72); text-align: center; z-index: 4; }
.cam-head h1 { font-size: 17px; font-weight: 700; margin-top: 8px; }
.cam-head p { font-size: 13px; color: #ddd; margin-top: 2px; }
.cam-head .done { position: absolute; right: 18px; top: 10px; font-size: 15px; color: #fff; }
.viewfinder { position: absolute; top: 110px; left: 0; width: 390px; height: 530px; overflow: hidden; }
.viewfinder .road { position: absolute; inset: 0; background: url(assets/road.png) center/cover; filter: brightness(.38) blur(1.2px); }
.viewfinder .car { position: absolute; width: 150px; left: 236px; top: 140px; filter: brightness(.45) blur(1.6px); }
.guide { position: absolute; left: 40px; top: 70px; width: 310px; height: 180px; border: 2.5px dashed rgba(255,255,255,.9); border-radius: 60px 70px 24px 24px; }
.guide span { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.6); padding: 3px 10px; border-radius: 999px; font-size: 13px; white-space: nowrap; }
.plate-box { position: absolute; left: 155px; top: 200px; width: 80px; height: 30px; border: 2px dashed #ffcc00; border-radius: 6px; }
.plate-box span { position: absolute; top: 32px; left: -6px; font-size: 11px; color: #ffcc00; white-space: nowrap; }
.ai { position: absolute; top: 122px; left: 12px; z-index: 3; }
.alert { position: absolute; left: 14px; right: 14px; top: 418px; background: #fff; color: var(--ink); border-radius: 16px; padding: 14px 16px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 6; }
.alert h2 { color: var(--red); font-size: 17px; display: flex; align-items: center; gap: 8px; }
.alert h2 b { width: 22px; height: 22px; border-radius: 50%; background: var(--red); color: #fff; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
.alert ul { list-style: none; margin: 10px 0 12px; }
.alert li { font-size: 14px; padding: 6px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-start; }
.alert li::before { content: '!'; flex: 0 0 18px; height: 18px; border-radius: 50%; background: var(--red-soft); color: var(--red); font-weight: 700; font-size: 12px; text-align: center; line-height: 18px; margin-top: 2px; }
.alert .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.alert .btn { height: 42px; font-size: 15px; }
.tray { position: absolute; left: 0; right: 0; top: 640px; bottom: 0; background: #2b2b2d; }
.thumbs { display: flex; gap: 14px; justify-content: center; padding-top: 14px; }
.thumbs div { width: 64px; height: 48px; border-radius: 6px; background: url(assets/thumbs.png) no-repeat; background-size: 350px 75px; position: relative; border: 2px solid transparent; }
.thumbs div:nth-child(1) { background-position: -5px -12px; }
.thumbs div:nth-child(2) { background-position: -85px -12px; border-color: var(--red); }
.thumbs div:nth-child(3) { background-position: -165px -12px; opacity: .5; }
.thumbs div:nth-child(4) { background-position: -245px -12px; opacity: .5; }
.thumbs div.ok::after { content: '✓'; position: absolute; right: -6px; top: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 12px; text-align: center; line-height: 18px; }
.shutter-row { display: flex; align-items: center; justify-content: center; position: relative; margin-top: 14px; }
.shutter { width: 66px; height: 66px; border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; }
.shutter i { width: 52px; height: 52px; border-radius: 50%; background: #fff; display: block; }
.flash { position: absolute; left: 70px; font-size: 22px; color: #ffcc00; }
.flash small { display: block; font-size: 10px; color: #ffcc00; }
.foot { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 11px; color: #bbb; }
</style></head>
<body>
<div class="status"><span>9:41</span><span class="right">●●●● 5G ▮</span></div>
<div class="cam-head"><h1>車身拍照</h1><p>左前 45°（2/10）・車外 8 張＋車內 2 張</p><span class="done">完成</span></div>
<div class="viewfinder">
  <div class="road"></div>
  <img class="car" src="assets/car.png">
  <div class="guide"><span>請將車輛對齊框線</span></div>
  <div class="plate-box"><span>車牌位置</span></div>
</div>
<div class="ai"><span class="ai-chip"><i></i>AI 即時檢查中</span></div>
<div class="alert">
  <h2><b>!</b>照片不合格，請重拍</h2>
  <ul>
    <li>畫面過暗，請開啟閃光燈</li>
    <li>未拍到車牌，請將車牌放進框內</li>
    <li>距離過遠，請靠近一步</li>
  </ul>
  <div class="row"><div class="btn ghost">開啟閃光燈</div><div class="btn primary">重拍</div></div>
</div>
<div class="tray">
  <div class="thumbs"><div class="ok"></div><div></div><div></div><div></div></div>
  <div class="shutter-row"><span class="flash">⚡<small>建議開啟</small></span><div class="shutter"><i></i></div></div>
  <div class="foot">AI 已即時檢查：位置、模糊、車牌、角度、距離、畫面過髒</div>
</div>
</body></html>
